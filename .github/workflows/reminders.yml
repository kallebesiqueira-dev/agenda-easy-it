name: Promemoria orari

# Il cron di Vercel (Hobby) gira solo 1×/giorno: non basta per il promemoria
# "a breve" (~2h prima). Questo workflow chiama l'endpoint OGNI ORA. L'endpoint
# è idempotente, quindi eseguirlo spesso non manda doppioni.
#
# Richiede un secret del repo: CRON_SECRET (stesso valore impostato su Vercel).
# Settings → Secrets and variables → Actions → New repository secret.

on:
  schedule:
    - cron: "0 * * * *" # ogni ora (UTC); GitHub può ritardare di qualche minuto
  workflow_dispatch: {} # permette l'esecuzione manuale dalla tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama /api/cron/reminders
        run: |
          curl -fsS -X GET "https://agendaeasy.it/api/cron/reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
